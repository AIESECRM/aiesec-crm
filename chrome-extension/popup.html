<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>AIESEC CRM Web Clipper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="clipper-header">
    <div class="logo-area">
      <div class="logo-badge">AIESEC</div>
      <div class="header-title">CRM Web Clipper</div>
    </div>
    <div class="header-subtitle">Google Haritalar Pazar Keşfi & Çakışma Kontrolü</div>
  </div>

  <!-- Giriş Paneli -->
  <div id="loginPanel" class="section card">
    <div class="card-title">🔐 CRM Girişi</div>
    <p class="card-desc">Eklentiyi kullanmak için AIESEC CRM hesabınızla giriş yapın.</p>
    <div class="form-group">
      <label class="section-label" for="loginEmail">Email</label>
      <input type="email" id="loginEmail" placeholder="email@example.com" />
    </div>
    <div class="form-group">
      <label class="section-label" for="loginPassword">Şifre</label>
      <input type="password" id="loginPassword" placeholder="••••••••" />
    </div>
    <div id="loginError" class="error-msg"></div>
    <button id="loginBtn" class="btn btn-primary">Giriş Yap</button>
  </div>

  <!-- Kullanıcı Bilgi Barı -->
  <div id="userBar" class="user-bar hidden">
    <div class="user-info">
      <span class="user-icon">👤</span>
      <span id="userName" class="user-name"></span>
    </div>
    <button id="logoutBtn" class="btn-logout" title="Çıkış Yap">🚪</button>
  </div>

  <!-- CRM Sunucu Adresi (gizli - varsayılan) -->
  <div class="section" style="display: none;">
    <label class="section-label" for="crmUrlInput">🌐 CRM Sunucu Adresi</label>
    <div class="input-row">
      <input type="text" id="crmUrlInput" value="https://www.aiesecrm.com" placeholder="https://www.aiesecrm.com" />
      <button id="saveUrlBtn" class="btn btn-secondary">Kaydet</button>
    </div>
    <div id="urlStatus" class="status-msg"></div>
  </div>

  <!-- Tarama Aracı -->
  <div id="scanPanel" class="section card hidden">
    <div class="card-title">📍 Harita Tarama Aracı</div>
    <p class="card-desc">Google Haritalar'da arama yapın, ardından sol paneldeki tüm işletmeleri toplu olarak tarayın.</p>
    <button id="scanBtn" class="btn btn-primary">
      <span>⚡ Tüm Sonuçları Tara</span>
    </button>
    <div id="scanStats" class="scan-stats hidden"></div>
  </div>

  <div id="scanResultList" class="result-list hidden"></div>

  <div class="footer">
    <span>AIESEC Türkiye B2B CRM</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
